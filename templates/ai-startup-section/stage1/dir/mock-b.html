<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Mock B — 불 켜지는 작업대</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080A;--ink:#EDE6DA;--mute:#6E6A63;--warm:#FFC98A;--hot:#FFE7C4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif}
canvas{position:absolute;inset:0}
nav{position:absolute;left:72px;right:72px;top:40px;display:flex;justify-content:space-between;font:400 13px 'IBM Plex Mono';letter-spacing:.14em;color:var(--mute);z-index:2}
nav b{color:var(--ink);font:500 18px 'IBM Plex Sans KR';letter-spacing:.3em}
h1{position:absolute;left:72px;top:640px;font:200 112px/1.05 'IBM Plex Sans KR';letter-spacing:-.04em;z-index:2}
h1 span{color:var(--warm);font-weight:300}
.cap{position:absolute;right:72px;top:690px;width:380px;font:300 18px/1.7 'IBM Plex Sans KR';color:#B5ADA1;z-index:2}
.cap small{display:block;font:400 12px 'IBM Plex Mono';letter-spacing:.14em;color:var(--warm);margin-bottom:14px}
.bar{position:absolute;left:72px;right:72px;bottom:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;z-index:2;font:400 12px 'IBM Plex Mono';letter-spacing:.12em;color:var(--mute)}
.bar div{border-top:1px solid #2a2824;padding-top:12px}
.bar div.on{border-top:1px solid var(--warm);color:var(--ink)}
.cta{position:absolute;right:72px;top:40px;z-index:3;font:500 14px 'IBM Plex Sans KR';border:1px solid #3a3630;color:var(--ink);padding:10px 18px;border-radius:2px}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<nav><b>온갖</b><span>03 / 05 &nbsp;— 게임</span><span style="width:160px"></span></nav>
<a class="cta">아이디어 보내기</a>
<h1>불을 켜면,<br><span>게임이 됩니다.</span></h1>
<div class="cap"><small>CASE 03 — 퍼즐 게임 · 프로토타입</small>선 몇 개였던 것이 빛이 지나간 자리부터 단단해집니다. 우리가 AI와 만드는 방식이 그렇습니다 — 윤곽을 먼저, 재질은 그다음.</div>
<div class="bar"><div>01 서문</div><div>02 프로그램</div><div class="on">03 게임</div><div>04 도구</div><div>05 의뢰</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
// floor glow
let g=x.createRadialGradient(1100,520,10,1100,520,900);g.addColorStop(0,'rgba(255,190,120,.16)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,1920,1080);
// isometric puzzle board (built in code): grid of blocks, wireframe left of sweep, solid lit right of sweep
const cx=1120,cy=330,s=46;
function iso(i,j,k){return [cx+(i-j)*s*0.95,cy+(i+j)*s*0.55-k*s*0.9]}
const H=(i,j)=>{const v=Math.sin(i*1.3)+Math.cos(j*0.9)+Math.sin((i+j)*.5);return v>1.2?2:v>0.2?1:0};
const sweep=(i,j)=>i-j; const edge=1.5;
const blocks=[];for(let i=0;i<9;i++)for(let j=0;j<9;j++)for(let k=0;k<=H(i,j);k++)blocks.push([i,j,k]);
blocks.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
for(const [i,j,k] of blocks){
 const lit=sweep(i,j)>edge, near=Math.abs(sweep(i,j)-edge)<1.2;
 const t=iso(i,j,k+1),r=iso(i+1,j,k+1),b=iso(i+1,j+1,k+1),l=iso(i,j+1,k+1);
 const r0=iso(i+1,j,k),b0=iso(i+1,j+1,k),l0=iso(i,j+1,k);
 const face=(p,fill,stroke)=>{x.beginPath();x.moveTo(...p[0]);p.slice(1).forEach(q=>x.lineTo(...q));x.closePath();if(fill){x.fillStyle=fill;x.fill()}x.strokeStyle=stroke;x.lineWidth=1;x.stroke()};
 if(lit){const a=near?1:.8;
  face([t,r,b,l],`rgba(255,${206+k*10},${150+k*20},${a})`,'rgba(60,40,20,.5)');
  face([l,b,b0,l0],`rgba(120,80,45,${a})`,'rgba(30,20,10,.6)');
  face([b,r,r0,b0],`rgba(190,130,75,${a})`,'rgba(30,20,10,.6)');
 }else{const al=near?.85:.32;const st=`rgba(255,201,138,${al})`;
  face([t,r,b,l],null,st);face([l,b,b0,l0],null,st);face([b,r,r0,b0],null,st);}
}
// character (code-built): a small round piece on the lit side
const [px,py]=iso(6.5,2.5,H(6,2)+1);x.fillStyle='#FFF4E0';x.beginPath();x.ellipse(px,py-26,16,22,0,0,7);x.fill();x.fillStyle='#07080A';x.fillRect(px-7,py-32,4,6);x.fillRect(px+3,py-32,4,6);
// light sweep band
x.save();x.globalCompositeOperation='screen';
const [ax,ay]=iso(edge+4.5,4.5,0);let lg=x.createLinearGradient(ax-260,ay+150,ax+260,ay-150);lg.addColorStop(0,'rgba(255,231,196,0)');lg.addColorStop(.5,'rgba(255,231,196,.22)');lg.addColorStop(1,'rgba(255,231,196,0)');
x.fillStyle=lg;x.beginPath();x.moveTo(ax-120,-50);x.lineTo(ax+120,-50);x.lineTo(ax+520,1130);x.lineTo(ax+280,1130);x.fill();x.restore();
// grain
const id=x.getImageData(0,0,1920,1080),d=id.data;for(let n=0;n<d.length;n+=4){const v=(Math.random()-.5)*18;d[n]+=v;d[n+1]+=v;d[n+2]+=v}x.putImageData(id,0,0);
</script></body></html>
